<body>

<nav>

<section class="hero">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1625944525903-c4b9d98efb10">

      <button class="btn" onclick="addItem('Dahi Puri')">Order</button>

  </div>
</section>

  <h2>About</h2>
  <p>Aziz Bhai ki chaat apne unique taste aur quality ke liye famous hai 💯</p>
</section>

<section class="contact" id="contact">
  <h2>Contact</h2>
  <p>📍 Sadar Bazar</p>
