<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1 Pani Puri</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:linear-gradient(135deg,#ff4d4d,#ff9966);
  color:#fff;
  overflow-x:hidden;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}

nav a{
  color:white;
  margin-left:15px;
  text-decoration:none;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h2{
  font-size:40px;
}

.btn{
  padding:10px 20px;
  border:none;
  background:white;
  color:#ff4d4d;
  margin-top:15px;
  cursor:pointer;
  border-radius:20px;
  font-weight:bold;
}

.btn:hover{
  background:#ff4d4d;
  color:white;
  transition:0.3s;
}

/* MENU */
.menu{
  padding:40px;
  text-align:center;
}

.cards{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:15px;
  width:220px;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  border-radius:10px;
}

/* CART */
.cart{
  position:fixed;
  right:10px;
  bottom:10px;
  background:black;
  padding:15px;
  border-radius:10px;
  width:220px;
}

.cart h3{
  margin-bottom:10px;
}

.cart ul{
  max-height:200px;
  overflow-y:auto;
  padding-left:20px;
}

.cart button{
  width:100%;
  margin-top:10px;
}

/* ABOUT */
.about{
  padding:40px;
  text-align:center;
}

/* MOBILE */
@media(max-width:768px){
  .hero h2{
    font-size:25px;
  }

  nav{
    flex-direction:column;
    text-align:center;
  }
}
</style>
</head>

<body>

<nav>
  <h2>A1 Pani Puri</h2>
  <div>
    <a href="#">Home</a>
    <a href="#menu">Menu</a>
  </div>
</nav>

<section class="hero">
  <div>
    <h2>🔥 Best Chaat in Town</h2>
    <p>Aziz Bhai ka famous taste 😍</p>
    <button class="btn" onclick="scrollMenu()">Order Now</button>
  </div>
</section>

<section class="menu" id="menu">
  <h2>Our Menu</h2>

  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1604908176997-4312c44fa1a2" alt="Chole Chaat">
      <h3>Chole Chaat</h3>
      <p>₹20</p>
      <button class="btn" onclick="addItem('Chole Chaat')">Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1625944525903-c4b9d98efb10" alt="Dahi Puri">
      <h3>Dahi Puri</h3>
      <p>₹20</p>
      <button class="btn" onclick="addItem('Dahi Puri')">Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1617196032235-1aaae5b62269" alt="Pani Puri">
      <h3>Pani Puri</h3>
      <p>₹20</p>
      <button class="btn" onclick="addItem('Pani Puri')">Add</button>
    </div>

  </div>
</section>

<section class="about">
  <h2>About Aziz Bhai</h2>
  <p>Aziz Bhai ki chaat ka taste ekdum unique hai 💯 log door door se aate hain!</p>
</section>

<!-- CART -->
<div class="cart">
  <h3>🛒 Cart</h3>
  <ul id="cartItems"></ul>
  <button class="btn" onclick="orderWhatsApp()">Order</button>
</div>

<script>
let cart = [];

function addItem(item){
  let existing = cart.find(i => i.name === item);
  if(existing){
    existing.qty++;
  } else {
    cart.push({name:item, qty:1});
  }
  updateCart();
}

function updateCart(){
  let list = document.getElementById("cartItems");
  list.innerHTML = "";
  cart.forEach(i=>{
    let li = document.createElement("li");
    li.innerText = `${i.name} x${i.qty}`;
    list.appendChild(li);
  });
}

function scrollMenu(){
  document.getElementById("menu").scrollIntoView({behavior:"smooth"});
}

function orderWhatsApp(){
  if(cart.length === 0){
    alert("Add items first!");
    return;
  }

  let number = "919302332196"; // Aziz Bhai's WhatsApp number
  let msg = "Hello Aziz Bhai, I want:\n";

  cart.forEach(i=>{
    msg += `- ${i.name} x${i.qty}\n`;
  });

  let url = "https://wa.me/"+number+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}
</script>

</body>
</html>
